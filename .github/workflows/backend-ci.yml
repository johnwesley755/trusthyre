name: Backend CI

on:
  push:
    branches: [ main, dev-branch, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Backend Validation, Types & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: trusthire_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/trusthire_test_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/trusthire_test_db?schema=public"
      JWT_SECRET: "test-super-secret-jwt-key-for-unit-tests-1234567890"
      QR_SIGNING_SECRET: "test-qr-hmac-sha256-signing-secret-key-32bytes-long"
      NODE_ENV: test

    defaults:
      run:
        working-directory: node-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: node-backend/package-lock.json

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: Apply Raw RLS Security Migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261111_neon_rls_security_hardening.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261112_recommendation_system.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261113_digital_work_orders.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261113_shifts_and_attendance.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261113_audit_hardening_phases_1_to_4.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261113_audit_hardening_part2.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261113_audit_hardening_part3.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261114_audit_hardening_part4.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261114_audit_hardening_part5.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -f prisma/migrations/20261114_neon_app_role_rls_setup.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d trusthire_test_db -c "ALTER ROLE trusthire_app WITH PASSWORD 'apptestpassword';"

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Run Backend Regression Test Suite
        run: bun test
        env:
          NODE_ENV: test
          JWT_SECRET: test-super-secret-jwt-key-for-unit-tests-1234567890
          QR_SIGNING_SECRET: test-qr-hmac-sha256-signing-secret-key-32bytes-long
