<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-image.png" />
    <link rel="apple-touch-icon" href="/logo-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustHyre | Hire Verified Skilled Workers & Blue-Collar Talent in India</title>
    <meta name="description" content="India's premier verified skilled workforce platform. Hire certified electricians, commercial chefs, warehouse logistics crew, plumbers, and technicians with photo check-in verification and direct employer matching." />
    <meta name="keywords" content="hire skilled workers India, blue collar hiring platform, verified electricians, commercial chefs, restaurant cooks, warehouse logistics staff, licensed plumbers, HVAC technicians, direct hiring zero broker fee, attendance check-in workforce, Indian trade candidates, TrustHyre" />
    <meta name="theme-color" content="#0f2f63" />
    <!-- Dynamic Canonical managed per-page by SeoHead -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrustHyre" />
    <meta property="og:url" content="https://trusthyre.com/" />
    <meta property="og:title" content="TrustHyre | Trusted talent. Better hiring." />
    <meta property="og:description" content="India's verified skilled workforce and talent hiring network with biometric verification and direct placements." />
    <meta property="og:image" content="https://trusthyre.com/logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trusthyre.com/" />
    <meta name="twitter:title" content="TrustHyre | Trusted talent. Better hiring." />
    <meta name="twitter:description" content="India's verified skilled workforce and talent hiring network with biometric verification and direct placements." />
    <meta name="twitter:image" content="https://trusthyre.com/logo.png" />

    <!-- Schema.org JSON-LD Structured Data for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trusthyre.com/#organization",
          "name": "TrustHyre",
          "url": "https://trusthyre.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://trusthyre.com/logo.png"
          },
          "description": "India's premier verified skilled workforce and talent hiring network with biometric verification and direct placements."
        },
        {
          "@type": "WebSite",
          "@id": "https://trusthyre.com/#website",
          "url": "https://trusthyre.com/",
          "name": "TrustHyre",
          "publisher": {
            "@id": "https://trusthyre.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://trusthyre.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
